name: Set up Windows dependencies
description: Install the FFmpeg/ASIO SDKs and static pthreads used by CuePool builds and tests.
inputs:
  save-cache:
    description: Save Rust build outputs after a successful job.
    default: 'true'
outputs:
  cache-hit:
    description: Whether the Rust cache matched exactly.
    value: ${{ steps.rust-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Install FFmpeg SDK
      shell: pwsh
      run: |
        # Keep the SDK and runtime DLLs on FFmpeg 8.0: the D3D12VA layout
        # guard rejects the ABI rework in 8.1.2+.
        $deps = Get-Content "packaging/windows-dependencies.json" -Raw | ConvertFrom-Json
        curl.exe --fail -L -o "$env:RUNNER_TEMP\ffmpeg.zip" $deps.ffmpeg.binary.url
        if ($LASTEXITCODE -ne 0) { throw "FFmpeg SDK download failed" }
        $expected = $deps.ffmpeg.binary.sha256
        $actual = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash.ToLower()
        if ($actual -ne $expected) { throw "ffmpeg-8.0 SDK digest mismatch: $actual" }
        Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
        $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
        "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV
        "$($dir.FullName)\bin" >> $env:GITHUB_PATH

    - name: Install pinned ASIO SDK
      shell: pwsh
      run: |
        # asio-sys otherwise downloads the moving steinberg.net/asiosdk alias.
        $deps = Get-Content "packaging/windows-dependencies.json" -Raw | ConvertFrom-Json
        curl.exe --fail -L -o "$env:RUNNER_TEMP\asio.zip" $deps.asio.url
        if ($LASTEXITCODE -ne 0) { throw "ASIO SDK download failed" }
        $expected = $deps.asio.sha256
        $actual = (Get-FileHash "$env:RUNNER_TEMP\asio.zip" -Algorithm SHA256).Hash.ToLower()
        if ($actual -ne $expected) { throw "ASIO 2.3.4 SDK digest mismatch: $actual" }
        Expand-Archive "$env:RUNNER_TEMP\asio.zip" -DestinationPath "$env:RUNNER_TEMP\asio"
        $dir = "$env:RUNNER_TEMP\asio\ASIOSDK"
        if (!(Test-Path "$dir\common\asio.h" -PathType Leaf) -or !(Test-Path "$dir\host\asiodrivers.h" -PathType Leaf)) {
          throw "ASIO SDK is missing required headers"
        }
        "CPAL_ASIO_DIR=$dir" >> $env:GITHUB_ENV

    - name: Install pthreads for AprilTag
      shell: pwsh
      run: |
        # Static pthreads avoids another runtime DLL; dynamic CRT matches
        # Rust's default MSVC runtime and apriltag-sys's /MD compilation.
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install pthreads:x64-windows-static-md
        if ($LASTEXITCODE -ne 0) { throw "pthreads installation failed" }
        $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
        $include = "$prefix\include"
        $library = "$prefix\lib\pthreadVC3.lib"
        if (!(Test-Path "$include\pthread.h" -PathType Leaf) -or !(Test-Path $library -PathType Leaf)) {
          throw "pthreads installation is missing pthread.h or pthreadVC3.lib"
        }
        "APRILTAG_SYS_METHOD=raw,static" >> $env:GITHUB_ENV
        "APRILTAG_SYS_WINDOWS_PTHREAD_INCLUDE_DIR=$include" >> $env:GITHUB_ENV
        "APRILTAG_SYS_WINDOWS_PTHREAD_STATIC_LIB=$library" >> $env:GITHUB_ENV

    - name: Identify native toolchain image
      id: native-image
      shell: pwsh
      run: |
        if (!$env:ImageVersion) { throw 'The Windows SDK cache requires a hosted runner image version' }
        "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

    # Native bindings do not reliably rebuild when SDK contents change. Keep
    # SDK/setup/image identity in `key`, which rust-cache retains in ALL restore
    # prefixes, including Cargo.lock fallbacks. Restore only after SDK paths
    # are configured, so the environment hash also covers native inputs.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      id: rust-cache
      with:
        key: windows-sdk-v1-${{ hashFiles('packaging/windows-dependencies.json', '.github/actions/setup-windows-deps/action.yml') }}-${{ steps.native-image.outputs.version }}
        env-vars: CARGO CC CFLAGS CXX CMAKE RUST FFMPEG_DIR CPAL_ASIO_DIR APRILTAG_SYS VCPKG_INSTALLATION_ROOT
        save-if: ${{ inputs.save-cache }}
